- name: Upgrade Proxmox hosts
  hosts: pve_nodes
  become: true
  tasks:
    - name: Update cache + dist upgrade
      ansible.builtin.apt:
        update_cache: yes
        upgrade: dist

    - name: Check reboot required
      ansible.builtin.stat:
        path: /var/run/reboot-required
      register: reboot_required

    - name: Report if reboot needed
      ansible.builtin.debug:
        msg: "Reboot required on {{ inventory_hostname }}"
      when: reboot_required.stat.exists
