all:
  vars:
    ansible_user: root
    ansible_ssh_private_key_file: ~/.ssh/id_ed25519
    ansible_python_interpreter: /usr/bin/python3
    timezone: Australia/Sydney
    docker_registry_mirrors: ["https://registry.h-and-i.com"]

  children:
    infrastructure:
      children:
        flint2:
          hosts:
            flint2:
              ansible_host: 192.168.8.1
    flint2:
      hosts:
        flint2:
          ansible_host: 192.168.8.1
    adguard:
      hosts:
        flint2:
          ansible_host: 192.168.8.1

    control:
      children:
        control-core:
          hosts:
            control-core:
              ansible_host: 192.168.8.100
        control-devops:
          hosts:
            control-devops:
              ansible_host: 192.168.8.101
        control-edge:
          hosts:
            control-edge:
              ansible_host: 192.168.8.102

    soyo:
      children:
        soyo_watch:
          hosts:
            soyo_watch:
              ansible_host: 192.168.8.120
        samba:
          hosts:
            samba:
              ansible_host: 192.168.8.178
        seafile:
          hosts:
            seafile:
              ansible_host: 192.168.8.161

    # For backwards compat with old playbooks
    ms01:
      hosts:
        samba:
          ansible_host: 192.168.8.178
        seafile:
          ansible_host: 192.168.8.161

    # Groups used by roles/docker
    all_lxcs:
      hosts:
        control-core:
          ansible_host: 192.168.8.100
        control-devops:
          ansible_host: 192.168.8.101
        control-edge:
          ansible_host: 192.168.8.102
        soyo_watch:
          ansible_host: 192.168.8.120
        seafile:
          ansible_host: 192.168.8.161
