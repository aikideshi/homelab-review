---
- name: Load SOPS env contents
  ansible.builtin.set_fact:
    sops_env_content: "{{ lookup('community.sops.sops', sops_env_file | default(watch_sops_env_file | default(playbook_dir + '/../../secrets/watch.sops.env'))) }}"
  no_log: true
- name: Ensure service dir exists
  ansible.builtin.file:
    path: "{{ service_dir | default('/var/services/watch') }}"
    state: directory
    mode: "0755"
- name: Ensure data dirs
  ansible.builtin.file:
    path: "{{ (service_dir | default('/var/services/watch')) }}/data/{{ item }}"
    state: directory
    mode: "0755"
  loop: [wud, uptime, beszel, dozzle]
- name: Deploy .env
  ansible.builtin.copy:
    content: "{{ sops_env_content }}"
    dest: "{{ (service_dir | default('/var/services/watch')) }}/.env"
    mode: "0600"
  no_log: true
  notify: Restart watch
- name: Deploy compose.yml
  ansible.builtin.template:
    src: compose.yml.j2
    dest: "{{ (service_dir | default('/var/services/watch')) }}/compose.yml"
    mode: "0644"
  notify: Restart watch
- name: Ensure watch stack up
  community.docker.docker_compose_v2:
    project_src: "{{ service_dir | default('/var/services/watch') }}"
    state: present
    pull: always
    remove_orphans: true
- name: Deploy Caddy fragments
  ansible.builtin.template:
    src: "caddy-{{ item }}.conf.j2"
    dest: "/var/services/core/caddy.d/{{ item }}.conf"
    mode: "0644"
  loop: [uptime, beszel, dozzle, wud]
  delegate_to: control-core
  notify: Reload Caddy
