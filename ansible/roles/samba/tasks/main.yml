---
- name: Install Samba packages
  ansible.builtin.apt:
    name:
      - samba
      - samba-common-bin
      - cifs-utils
      - acl
      - attr
    state: present

- name: Ensure homerong user exists
  ansible.builtin.user:
    name: homerong
    shell: /usr/sbin/nologin
    create_home: false
    state: present

- name: Check if Samba user exists
  ansible.builtin.command: "pdbedit --user=homerong"
  register: samba_user_check
  failed_when: false
  changed_when: false

- name: Create Samba user and set password
  ansible.builtin.command:
    cmd: "smbpasswd -s -a homerong"
    stdin: |
      {{ samba_homerong_password }}
      {{ samba_homerong_password }}
  when: samba_user_check.rc != 0
  no_log: true
  changed_when: true

- name: Deploy smb.conf
  ansible.builtin.template:
    src: smb.conf.j2
    dest: /etc/samba/smb.conf
    mode: "0644"
    validate: "testparm -s %s"
  notify: Reload samba

- name: Ensure Samba enabled and running
  ansible.builtin.systemd:
    name: "{{ item }}"
    enabled: true
    state: started
  loop: [smbd, nmbd]
